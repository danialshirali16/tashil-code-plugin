<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tashil Code — Sync Tokens preview</title>
<style>
  /* ---- Figma plugin theme tokens (real values used by the plugin) ---- */
  :root {
    --figma-color-bg: #ffffff;
    --figma-color-bg-secondary: #f5f5f5;
    --figma-color-bg-hover: #f0f0f0;
    --figma-color-bg-brand: #0d99ff;
    --figma-color-bg-brand-hover: #3cb1ff;
    --figma-color-border: #e6e6e6;
    --figma-color-border-strong: #b3b3b3;
    --figma-color-border-brand-strong: #0d99ff;
    --figma-color-text: #1a1a1a;
    --figma-color-text-secondary: #7f7f7f;
    --figma-color-text-tertiary: #a8a8a8;
    --figma-color-text-brand: #0d99ff;
    --figma-color-text-onbrand: #ffffff;
    --figma-color-text-danger: #b42318;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--figma-color-bg-secondary);
    color: var(--figma-color-text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- Plugin window: 480px wide, matches showUI({width:480,height:589}) ---- */
  .plugin {
    background: var(--figma-color-bg);
    border: 1px solid var(--figma-color-border);
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    height: 589px;
    overflow: hidden;
    width: 480px;
  }

  /* ---- Header (tab bar) ---- */
  .header {
    align-items: center;
    border-bottom: 1px solid var(--figma-color-border);
    display: flex;
    gap: 4px;
    height: 40px;
    justify-content: space-between;
    padding: 0 16px;
  }
  .reference-tabs { align-items: center; display: flex; gap: 4px; }
  .reference-tab {
    appearance: none;
    background: transparent;
    border: 0;
    border-radius: 4px;
    color: var(--figma-color-text);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    padding: 4px 8px;
  }
  .reference-tab-active {
    background: var(--figma-color-bg-secondary);
    font-weight: 600;
  }
  .icon-button {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 4px;
    color: var(--figma-color-text-secondary);
    cursor: pointer;
    display: flex;
    height: 24px;
    justify-content: center;
    width: 24px;
  }
  .icon-button:hover { background: var(--figma-color-bg-hover); color: var(--figma-color-text); }

  /* ---- Scrollable panel ---- */
  .panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: auto;
    padding: 16px;
    flex: 1;
  }

  /* ---- Section + list (reuses plugin's .reference-list pattern) ---- */
  .section { display: grid; gap: 8px; }
  .section-header {
    align-items: center;
    display: flex;
    justify-content: space-between;
  }
  .section-title { font-size: 11px; font-weight: 600; margin: 0; }
  .section-meta { color: var(--figma-color-text-secondary); font-size: 11px; }

  .list {
    border: 1px solid var(--figma-color-border);
    border-radius: 6px;
    margin: 0;
    overflow: hidden;
  }
  .row {
    align-items: start;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 12px;
  }
  .row + .row { border-top: 1px solid var(--figma-color-border); }

  .row-main { align-items: center; display: flex; gap: 8px; min-width: 0; }
  .row-name {
    color: var(--figma-color-text);
    font-size: 11px;
    font-weight: 500;
    line-height: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row-count { color: var(--figma-color-text-tertiary); font-size: 11px; }
  .row-types { display: flex; gap: 4px; margin-left: auto; }
  .type-badge {
    background: var(--figma-color-bg-secondary);
    border-radius: 3px;
    color: var(--figma-color-text-secondary);
    font-size: 9px;
    letter-spacing: 0.3px;
    line-height: 14px;
    padding: 1px 5px;
    text-transform: uppercase;
  }

  /* mode chips (multi-select) */
  .modes { align-items: center; display: flex; flex-wrap: wrap; gap: 4px; padding-left: 24px; }
  .chip {
    background: var(--figma-color-bg);
    border: 1px solid var(--figma-color-border);
    border-radius: 10px;
    color: var(--figma-color-text-secondary);
    cursor: pointer;
    font: inherit;
    font-size: 10px;
    line-height: 16px;
    padding: 2px 8px;
  }
  .chip:hover { border-color: var(--figma-color-border-strong); }
  .chip.active {
    background: var(--figma-color-bg-brand);
    border-color: var(--figma-color-bg-brand);
    color: var(--figma-color-text-onbrand);
  }

  /* checkbox */
  .checkbox {
    accent-color: var(--figma-color-bg-brand);
    height: 14px;
    margin: 0;
    width: 14px;
  }

  /* link button */
  .link {
    background: none;
    border: 0;
    color: var(--figma-color-text-brand);
    cursor: pointer;
    font: inherit;
    font-size: 11px;
    padding: 0;
  }
  .link:hover { text-decoration: underline; }

  /* ---- Advanced disclosure ---- */
  .disclosure {
    border: 1px solid var(--figma-color-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .disclosure summary {
    cursor: pointer;
    font-size: 11px;
    font-weight: 500;
    list-style: none;
    padding: 10px 12px;
  }
  .disclosure summary::-webkit-details-marker { display: none; }
  .disclosure summary::before { content: '▸ '; color: var(--figma-color-text-secondary); display: inline-block; transition: transform .15s; }
  .disclosure[open] summary::before { transform: rotate(90deg); }
  .disclosure-body { display: flex; flex-direction: column; gap: 14px; padding: 0 12px 12px; }

  .field { display: grid; gap: 6px; }
  .field-label { color: var(--figma-color-text); font-size: 11px; line-height: 16px; }
  .toggle-row { align-items: center; display: flex; gap: 8px; }
  .toggle-label { color: var(--figma-color-text); font-size: 11px; }
  .toggle-hint { color: var(--figma-color-text-tertiary); font-size: 11px; }

  /* switch */
  .switch { background: var(--figma-color-border-strong); border-radius: 999px; height: 16px; position: relative; transition: background .15s; width: 28px; }
  .switch::after { background: #fff; border-radius: 50%; content: ''; height: 12px; left: 2px; position: absolute; top: 2px; transition: left .15s; width: 12px; }
  .switch.on { background: var(--figma-color-bg-brand); }
  .switch.on::after { left: 14px; }

  .text-input {
    background: var(--figma-color-bg);
    border: 1px solid var(--figma-color-border);
    border-radius: 4px;
    font: inherit;
    font-size: 11px;
    padding: 4px 8px;
    width: 80px;
  }
  .text-input:focus { border-color: var(--figma-color-border-brand-strong); outline: none; }

  /* radio group */
  .radios { display: flex; flex-wrap: wrap; gap: 6px; }
  .radio {
    align-items: center;
    background: var(--figma-color-bg);
    border: 1px solid var(--figma-color-border);
    border-radius: 4px;
    color: var(--figma-color-text-secondary);
    cursor: pointer;
    display: flex;
    font: inherit;
    font-size: 11px;
    gap: 4px;
    padding: 4px 8px;
  }
  .radio input { accent-color: var(--figma-color-bg-brand); margin: 0; }
  .radio.active { border-color: var(--figma-color-bg-brand); color: var(--figma-color-text); }

  /* ---- Footer / export bar ---- */
  .footer {
    align-items: center;
    border-top: 1px solid var(--figma-color-border);
    display: flex;
    gap: 8px;
    justify-content: space-between;
    padding: 12px 16px;
  }
  .footer-meta { color: var(--figma-color-text-secondary); font-size: 11px; }
  .btn {
    align-items: center;
    background: var(--figma-color-bg-brand);
    border: 0;
    border-radius: 4px;
    color: var(--figma-color-text-onbrand);
    cursor: pointer;
    display: flex;
    font: inherit;
    font-size: 11px;
    font-weight: 500;
    gap: 6px;
    padding: 6px 14px;
  }
  .btn:hover { background: var(--figma-color-bg-brand-hover); }
  .btn:disabled { background: var(--figma-color-bg-hover); color: var(--figma-color-text-tertiary); cursor: not-allowed; }

  .error {
    color: var(--figma-color-text-danger);
    font-size: 11px;
    line-height: 16px;
  }

  /* variants toggle for preview only */
  .preview-controls {
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    padding: 12px;
    position: fixed;
    right: 24px;
    top: 24px;
    z-index: 10;
  }
  .preview-controls button {
    background: var(--figma-color-bg-secondary);
    border: 1px solid var(--figma-color-border);
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    padding: 4px 10px;
  }
  .preview-controls button.active { background: var(--figma-color-text); color: #fff; }
</style>
</head>
<body>

<div class="preview-controls">
  <button onclick="setVariant('default')" class="active" id="v-default">Default</button>
  <button onclick="setVariant('empty')" id="v-empty">Empty file</button>
  <button onclick="setVariant('expanded')" id="v-expanded">Advanced open</button>
</div>

<div class="plugin" id="plugin-root"><!-- rendered by JS --></div>

<template id="tpl-default">
  <div class="header">
    <div class="reference-tabs">
      <button class="reference-tab">Components</button>
      <button class="reference-tab">Inspect Code</button>
      <button class="reference-tab reference-tab-active">Sync Tokens</button>
    </div>
    <button class="icon-button" title="How it works">?</button>
  </div>

  <div class="panel">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Collections</h2>
        <span class="section-meta">2 selected · 64 variables</span>
      </div>

      <div class="list">
        <!-- Colors: multi-mode -->
        <div class="row">
          <div class="row-main">
            <input type="checkbox" class="checkbox" checked />
            <span class="row-name">Colors / Primitive</span>
            <span class="row-count">42</span>
            <span class="row-types">
              <span class="type-badge">color</span>
            </span>
          </div>
          <div class="modes">
            <button class="chip active">Light</button>
            <button class="chip active">Dark</button>
          </div>
        </div>

        <!-- Spacing: single mode -->
        <div class="row">
          <div class="row-main">
            <input type="checkbox" class="checkbox" checked />
            <span class="row-name">Spacing / Scale</span>
            <span class="row-count">12</span>
            <span class="row-types">
              <span class="type-badge">number</span>
            </span>
          </div>
        </div>

        <!-- Typography -->
        <div class="row">
          <div class="row-main">
            <input type="checkbox" class="checkbox" />
            <span class="row-name">Typography / Styles</span>
            <span class="row-count">18</span>
            <span class="row-types">
              <span class="type-badge">number</span>
              <span class="type-badge">string</span>
            </span>
          </div>
        </div>

        <!-- Radius -->
        <div class="row">
          <div class="row-main">
            <input type="checkbox" class="checkbox" />
            <span class="row-name">Radius</span>
            <span class="row-count">5</span>
            <span class="row-types">
              <span class="type-badge">number</span>
            </span>
          </div>
        </div>
      </div>

      <div class="section-header">
        <button class="link">Select all</button>
      </div>
    </div>

    <details class="disclosure">
      <summary>Advanced settings</summary>
      <div class="disclosure-body">
        <div class="toggle-row">
          <div class="switch on" data-switch></div>
          <div>
            <div class="toggle-label">Convert px to rem</div>
            <div class="toggle-hint">Length-scoped variables only</div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Root font size (px)</span>
          <input type="text" class="text-input" value="16" />
        </div>
        <div class="field">
          <span class="field-label">Color format</span>
          <div class="radios">
            <label class="radio active"><input type="radio" name="cf" checked /> HEX</label>
            <label class="radio"><input type="radio" name="cf" /> RGB</label>
            <label class="radio"><input type="radio" name="cf" /> RGBA</label>
            <label class="radio"><input type="radio" name="cf" /> Variable</label>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Token name style</span>
          <div class="radios">
            <label class="radio active"><input type="radio" name="ns" checked /> color-text</label>
            <label class="radio"><input type="radio" name="ns" /> color/text</label>
            <label class="radio"><input type="radio" name="ns" /> color_text</label>
            <label class="radio"><input type="radio" name="ns" /> ColorText</label>
          </div>
        </div>
      </div>
    </details>
  </div>

  <div class="footer">
    <span class="footer-meta">Exports 3 CSS files · zip</span>
    <button class="btn">Export</button>
  </div>
</template>

<template id="tpl-empty">
  <div class="header">
    <div class="reference-tabs">
      <button class="reference-tab">Components</button>
      <button class="reference-tab">Inspect Code</button>
      <button class="reference-tab reference-tab-active">Sync Tokens</button>
    </div>
    <button class="icon-button" title="How it works">?</button>
  </div>
  <div class="panel">
    <div style="align-items:center; color:var(--figma-color-text-secondary); display:flex; flex:1; flex-direction:column; gap:12px; justify-content:center; text-align:center;">
      <div style="font-size:40px; opacity:.4;">📁</div>
      <div style="font-size:13px;">No variable collections in this file.</div>
      <div style="font-size:11px;">Create collections in Figma’s Variables panel to export them as CSS.</div>
    </div>
  </div>
</template>

<template id="tpl-expanded">
  <div class="header">
    <div class="reference-tabs">
      <button class="reference-tab">Components</button>
      <button class="reference-tab">Inspect Code</button>
      <button class="reference-tab reference-tab-active">Sync Tokens</button>
    </div>
    <button class="icon-button" title="How it works">?</button>
  </div>
  <div class="panel">
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Collections</h2>
        <span class="section-meta">1 selected · 42 variables</span>
      </div>
      <div class="list">
        <div class="row">
          <div class="row-main">
            <input type="checkbox" class="checkbox" checked />
            <span class="row-name">Colors / Primitive</span>
            <span class="row-count">42</span>
            <span class="row-types"><span class="type-badge">color</span></span>
          </div>
          <div class="modes">
            <button class="chip active">Light</button>
            <button class="chip active">Dark</button>
          </div>
        </div>
      </div>
    </div>

    <details class="disclosure" open>
      <summary>Advanced settings</summary>
      <div class="disclosure-body">
        <div class="toggle-row">
          <div class="switch on" data-switch></div>
          <div>
            <div class="toggle-label">Convert px to rem</div>
            <div class="toggle-hint">Length-scoped variables only</div>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Root font size (px)</span>
          <input type="text" class="text-input" value="16" />
        </div>
        <div class="field">
          <span class="field-label">Color format</span>
          <div class="radios">
            <label class="radio active"><input type="radio" name="cf2" checked /> HEX</label>
            <label class="radio"><input type="radio" name="cf2" /> RGB</label>
            <label class="radio"><input type="radio" name="cf2" /> RGBA</label>
            <label class="radio"><input type="radio" name="cf2" /> Variable</label>
          </div>
        </div>
        <div class="field">
          <span class="field-label">Token name style</span>
          <div class="radios">
            <label class="radio active"><input type="radio" name="ns2" checked /> color-text</label>
            <label class="radio"><input type="radio" name="ns2" /> color/text</label>
            <label class="radio"><input type="radio" name="ns2" /> color_text</label>
            <label class="radio"><input type="radio" name="ns2" /> ColorText</label>
          </div>
        </div>
      </div>
    </details>
  </div>
  <div class="footer">
    <span class="footer-meta">Exports 2 CSS files · zip</span>
    <button class="btn">Export</button>
  </div>
</template>

<script>
  function render(variant) {
    const tpl = document.getElementById('tpl-' + variant);
    const root = document.getElementById('plugin-root');
    root.innerHTML = '';
    root.appendChild(tpl.content.cloneNode(true));
    // wire up switches + chips + radios for interactivity
    root.querySelectorAll('[data-switch]').forEach(s => s.addEventListener('click', () => s.classList.toggle('on')));
    root.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('active')));
    root.querySelectorAll('.radios').forEach(group => {
      group.querySelectorAll('.radio').forEach(r => {
        r.querySelector('input').addEventListener('change', () => {
          group.querySelectorAll('.radio').forEach(x => x.classList.remove('active'));
          r.classList.add('active');
        });
      });
    });
    root.querySelectorAll('.checkbox').forEach(cb => {
      cb.addEventListener('change', () => {
        cb.closest('.row')?.style.toggleProperty?.('opacity');
      });
    });
  }
  function setVariant(v) {
    render(v);
    ['default','empty','expanded'].forEach(id => {
      document.getElementById('v-'+id).classList.toggle('active', id === v);
    });
  }
  render('default');
</script>
</body>
</html>
