name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Test, Lint, Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (4 tsconfig contexts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Bundle Size Audit
        run: npm run check:bundle

      - name: Check generated-file drift
        run: git diff --exit-code
