name: Bug report
description: Report reproducible incorrect behavior in Tashil Code.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Tashil Code. Do not include private source code, tokens, credentials, or confidential Figma content.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in the Figma Community listing or package.json.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Figma surface
      options:
        - Design mode — Connect component
        - Design mode — Inspect Code
        - Design mode — Sync Tokens
        - Design mode — Settings
        - Dev Mode — Tashil UI codegen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select …
        2. Open …
        3. Choose …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Paste only reviewed, non-sensitive diagnostics or attach a reviewed debug bundle.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed confidential Figma content, private source code, credentials, and access tokens.
          required: true

