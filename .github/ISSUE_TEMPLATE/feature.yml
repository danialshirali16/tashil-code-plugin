name: Feature request
description: Propose an improvement to a Tashil Code workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Connect component
        - Inspect Code / Dev Mode
        - Layout generation
        - Sync Tokens
        - Connection portability / coverage
        - Documentation / onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or proposed acceptance criteria
  - type: checkboxes
    id: local_first
    attributes:
      label: Local-first constraint
      options:
        - label: This request can work without sending Figma or source data to an external service.

